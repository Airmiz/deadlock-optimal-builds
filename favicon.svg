<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded-square background matching the page theme -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#0e1217"/>
  <!-- Subtle accent border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#f0a93b" stroke-width="0.75" opacity="0.45"/>
  <!-- Three ascending bars — the investment-spike staircase visual,
       which is the project's most distinctive ongoing motif. -->
  <rect x="6"  y="20" width="5" height="6"  rx="1" fill="#d6856b"/>
  <rect x="13.5" y="14" width="5" height="12" rx="1" fill="#6cb46a"/>
  <rect x="21" y="6"  width="5" height="20" rx="1" fill="#b487d9"/>
  <!-- Spike marker (the 4,800 milestone) — small accent dot above the tall bar -->
  <circle cx="23.5" cy="3" r="1.5" fill="#f0a93b"/>
</svg>
