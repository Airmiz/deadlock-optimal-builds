name: Refresh + deploy

# Pulls fresh data from the deadlock-api community API, regenerates the
# per-hero outputs, rebuilds the HTML page, commits the result back to
# main, and deploys the static site to GitHub Pages.
#
# Triggers:
#   - Nightly at 06:00 UTC
#   - Manual via Actions tab → "Run workflow"
#
# Setup required (one-time, in repo settings):
#   1. Settings → Pages → Source = "GitHub Actions"
#   2. Settings → Actions → General → Workflow permissions = "Read and write"
#      (so the job can push regenerated files back to main)
#   3. (optional) Set PATCH_ID env at the workflow level if you want a
#      different default than what's in scripts/_paths.py

on:
  schedule:
    # Every 3 hours, on the hour: 00, 03, 06, 09, 12, 15, 18, 21 UTC.
    # 8 runs/day. Each warm run is ~2-3 min so this is well under
    # GitHub's free-tier compute (and free for public repos anyway).
    # The deadlock-api caches analytics for 1 hour so 3-hour cadence
    # always pulls fresh data; faster than that mostly hits the cache.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      patch_id:
        description: 'Patch ID to refresh (defaults to all patches in scripts/_paths.py)'
        required: false
        default: ''

permissions:
  contents: write       # push regenerated files
  pages: write          # deploy to Pages
  id-token: write       # OIDC for Pages deploy

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pulp

      # The pipeline is idempotent — every fetch script skips files already
      # on disk. Persisting cache/ between scheduled runs takes the nightly
      # job from ~20 minutes (cold cache, fetching 1,400+ matchup endpoints)
      # down to ~2 minutes (warm cache, only re-fetches what the upstream
      # API has changed). Cache size is well under GitHub's 10 GB/repo cap.
      - name: Restore cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: cache
          # Key is bumped manually if we change cache layout / data shape.
          # restore-keys lets a partial-match still warm-load the cache.
          key: deadlock-cache-v1-${{ github.run_id }}
          restore-keys: |
            deadlock-cache-v1-

      - name: Refresh patch_125825 (older patch — stable counters)
        env:
          PATCH_ID: patch_125825
        run: |
          python3 scripts/batch_fetch.py
          python3 scripts/batch_fetch_builds.py
          # counters only re-fetched if a new build_id surfaces; cached entries skip
          python3 scripts/batch_fetch_counters.py
          python3 scripts/run_all_heroes.py

      - name: Refresh patch_129989 (current patch)
        env:
          PATCH_ID: patch_129989
        run: |
          python3 scripts/batch_fetch.py
          python3 scripts/batch_fetch_builds.py
          python3 scripts/run_all_heroes.py

      - name: Compile multi-patch page payload
        run: |
          python3 scripts/build_index.py
          python3 scripts/build_page_data.py
          python3 scripts/download_images.py
          python3 scripts/build_page.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A heroes/ assets/ deadlock_builds.html all_heroes_index.json all_heroes_tier_list.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: nightly refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      # Save cache/ so the next scheduled run starts warm. actions/cache@v4
      # only saves on a key MISS (i.e. cache wasn't fully restored), but
      # we always want the latest contents persisted, so we use the
      # always() condition — and bumping the key with run_id ensures every
      # successful run produces a fresh cache snapshot.
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: deadlock-cache-v1-${{ github.run_id }}

      - name: Stage Pages content
        run: |
          mkdir -p _site
          # GitHub Pages serves index.html by default
          cp deadlock_builds.html _site/index.html
          cp deadlock_builds.html _site/deadlock_builds.html
          cp methodology.html     _site/methodology.html
          cp -r assets _site/assets
          mkdir -p _site/docs
          cp -r docs/*.md _site/docs/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
