name: Refresh + deploy

# Pulls fresh data from the deadlock-api community API, regenerates the
# per-hero outputs, rebuilds the HTML page, commits the result back to
# main, and deploys the static site to GitHub Pages.
#
# Triggers:
#   - Nightly at 06:00 UTC
#   - Manual via Actions tab → "Run workflow"
#
# Setup required (one-time, in repo settings):
#   1. Settings → Pages → Source = "GitHub Actions"
#   2. Settings → Actions → General → Workflow permissions = "Read and write"
#      (so the job can push regenerated files back to main)
#   3. (optional) Set PATCH_ID env at the workflow level if you want a
#      different default than what's in scripts/_paths.py

on:
  schedule:
    # Every 3 hours, on the hour: 00, 03, 06, 09, 12, 15, 18, 21 UTC.
    # 8 runs/day. Each warm run is ~2-3 min so this is well under
    # GitHub's free-tier compute (and free for public repos anyway).
    # The deadlock-api caches analytics for 1 hour so 3-hour cadence
    # always pulls fresh data; faster than that mostly hits the cache.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      patch_id:
        description: 'Patch ID to refresh (defaults to all patches in scripts/_paths.py)'
        required: false
        default: ''
      refresh_assets:
        description: 'Force-refresh asset metadata + re-download all item icons (slower)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write       # push regenerated files; deploy.yml handles Pages

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pulp

      # The pipeline is idempotent — every fetch script skips files already
      # on disk. Persisting cache/ between scheduled runs takes the nightly
      # job from ~20 minutes (cold cache, fetching 1,400+ matchup endpoints)
      # down to ~2 minutes (warm cache, only re-fetches what the upstream
      # API has changed). Cache size is well under GitHub's 10 GB/repo cap.
      - name: Restore cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: cache
          # Key is bumped manually if we change cache layout / data shape.
          # restore-keys lets a partial-match still warm-load the cache.
          key: deadlock-cache-v1-${{ github.run_id }}
          restore-keys: |
            deadlock-cache-v1-

      # Optional asset-metadata bust. When the user ticks the
      # `refresh_assets` workflow input, drop the cached items.json and
      # heroes.json snapshots so the next batch_fetch step pulls fresh
      # ones. Useful when Valve adds new items (e.g. Grit, Indomitable)
      # that fall inside the 7-day TTL window and would otherwise be
      # invisible until the next weekly refresh.
      - name: Bust asset metadata cache (refresh_assets only)
        if: ${{ github.event.inputs.refresh_assets == 'true' }}
        run: |
          echo "Deleting cached asset metadata so batch_fetch re-pulls them"
          rm -f cache/items.json cache/heroes.json cache/playable_heroes.json
          rm -f cache/patch_125825/items.json cache/patch_125825/heroes.json cache/patch_125825/playable_heroes.json
          rm -f cache/patch_129989/items.json cache/patch_129989/heroes.json cache/patch_129989/playable_heroes.json
          # Also clear local icon cache so download_images.py re-pulls every
          # PNG/WEBP from the CDN, picking up any silently-rotated icons.
          rm -rf assets/items assets/heroes assets/abilities

      # Each fetch step uses TTL-aware caching (see batch_fetch.fetch):
      #   - Asset files (heroes/items.json) refresh weekly
      #   - Analytics files (item-stats, build-stats, counters, etc.) refresh
      #     every 2h, so the 3h cron always pulls fresh data
      #   - Individual published builds (build_*.json) cache forever — only
      #     their aggregate stats refresh
      # run_all_heroes.py regenerates per-hero outputs when ANY underlying
      # analytics file is newer than the existing output.
      - name: Refresh patch_125825 (older patch — stable counters)
        env:
          PATCH_ID: patch_125825
          # Force unbuffered stdout so progress lines stream to the Actions
          # log in real time. Without this, Python's block-buffered pipe
          # mode can stash 4-8 KB of output before flushing, making the
          # job look stuck when it's actually fetching normally.
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u scripts/batch_fetch.py
          python3 -u scripts/batch_fetch_builds.py
          python3 -u scripts/batch_fetch_counters.py
          python3 -u scripts/run_all_heroes.py

      - name: Refresh patch_129989 (current patch)
        env:
          PATCH_ID: patch_129989
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u scripts/batch_fetch.py
          python3 -u scripts/batch_fetch_builds.py
          python3 -u scripts/batch_fetch_counters.py
          python3 -u scripts/run_all_heroes.py

      # Methodology review §3.6 — match-only archetype resolution lives in
      # its own dedicated workflow (.github/workflows/resolve-archetypes.yml)
      # because a full bulk pass can take hours on the first run (Eternus+
      # uses a 1500-deep candidate sweep). Trigger that workflow manually
      # after each new patch lands. Cache files (under
      # cache/match_archetype_resolutions/) persist across runs and are
      # automatically consumed by build_page_data.py below, so the refresh
      # workflow always picks up whatever's already been resolved.

      - name: Build index (per-patch fingerprints)
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u scripts/build_index.py

      # Resolve per-item icon overrides from the community Deadlock wiki
      # BEFORE the payload is built. Why this order:
      #   1. items.json reuses asset filenames across unrelated items
      #      (Mercurial Magnum + Ballistic Enchantment both ship as
      #      fire_rate_plus.png — 60 such collisions in the live data).
      #      Overwriting assets/items/<basename>.png would silently
      #      cross-wire icons.
      #   2. scrape_wiki_icons.py writes one file per item id under
      #      assets/items_wiki/ and emits cache/wiki_icon_overrides.json.
      #   3. build_page_data.py loads that manifest at startup and
      #      overrides items_assets[id].image with the per-item path,
      #      so every downstream image reference (recommended,
      #      items_by_slice, lineage_chain, archetypes, match-only,
      #      items_dict) gets the right icon.
      #
      # Runs on EVERY refresh (no refresh_assets gate). Why:
      #   - The manifest (cache/wiki_icon_overrides.json) MUST exist for
      #     build_page_data to apply overrides — otherwise items fall
      #     through to the colliding assets/items/ namespace and the
      #     live site cross-wires icons.
      #   - cache/ is gitignored except for wiki_icon_overrides.json
      #     (single-file negation in .gitignore), so the manifest is
      #     committed back to main after each refresh and is present
      #     on every fresh checkout.
      #   - The script is cheap: ~5 batched MediaWiki API calls + skip
      #     downloads when local bytes match (identical-check). Adds
      #     ~5-15s to refresh runtime, worth it for correctness.
      #   - Also catches newly-added items: when Valve ships a new
      #     item and the wiki adds a page, the next refresh picks
      #     it up without needing a manual refresh_assets trigger.
      - name: Resolve wiki icon overrides
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u scripts/scrape_wiki_icons.py

      - name: Compile multi-patch page payload + download api icons
        env:
          PYTHONUNBUFFERED: '1'
          # When refresh_assets is set, download_images.py re-downloads
          # every icon (not just missing ones). Otherwise it skips
          # icons that already exist locally — the default fast path.
          FORCE_ASSETS: ${{ github.event.inputs.refresh_assets == 'true' && '1' || '' }}
        run: |
          python3 -u scripts/build_page_data.py
          python3 -u scripts/download_images.py
          python3 -u scripts/build_page.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A heroes/ assets/ deadlock_builds.html all_heroes_index.json all_heroes_tier_list.csv cache/wiki_icon_overrides.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: nightly refresh $(date -u +%Y-%m-%d)"
          # Retry the push up to 5 times. While this workflow was running,
          # another workflow (deploy.yml or a manual commit) may have
          # pushed to main, leaving our local clone behind. On rejection,
          # fetch + rebase our refresh commit on top of the new tip and
          # try again. Most races resolve on the first retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/main"
            git fetch origin main
            # --autostash protects any uncommitted leftovers; the rebase
            # itself just moves our single commit on top of the new main.
            git rebase --autostash origin/main || {
              echo "Rebase failed — aborting"
              git rebase --abort
              exit 1
            }
            sleep 5
          done
          echo "Push still failing after 5 retries — giving up"
          exit 1

      # Save cache/ so the next scheduled run starts warm. actions/cache@v4
      # only saves on a key MISS (i.e. cache wasn't fully restored), but
      # we always want the latest contents persisted, so we use the
      # always() condition — and bumping the key with run_id ensures every
      # successful run produces a fresh cache snapshot.
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: deadlock-cache-v1-${{ github.run_id }}

      # Pages deployment is handled by .github/workflows/deploy.yml.
      # It auto-triggers when our `Commit changes` step above pushes the
      # regenerated HTML / hero JSONs to main, so we don't duplicate the
      # deploy here. Two workflows hitting the same `github-pages`
      # environment simultaneously would race and one would get a 401.
