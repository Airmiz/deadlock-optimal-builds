name: Deploy on push

# Deploys the already-committed site files (deadlock_builds.html,
# methodology.html, assets/, favicon.svg, docs/) to GitHub Pages on every
# push to main. Decoupled from refresh.yml so visual/code changes ship
# immediately instead of waiting for the next data-refresh window.
#
# refresh.yml = data + build + deploy (slow path, every 3 hours)
# deploy.yml  = deploy only          (fast path, every push)

on:
  push:
    branches: [main]
    # Skip pushes that don't touch site-relevant files (e.g. cache/)
    paths:
      - 'deadlock_builds.html'
      - 'methodology.html'
      - 'rank_distribution.html'
      - 'favicon.svg'
      - 'assets/**'
      - 'docs/**'
      - 'heroes/**'
      - 'all_heroes_index.json'
      - 'all_heroes_tier_list.csv'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  # Run after refresh.yml / resolve-archetypes.yml commit + push their
  # rebuilt site files. Why this is needed: pushes made by the default
  # GITHUB_TOKEN are intentionally blocked from triggering other
  # workflows (anti-recursion safeguard). Without this `workflow_run`,
  # nightly data refreshes commit fresh HTML/icons to main but Pages
  # never republishes — the live site silently lags behind main.
  # `workflow_run` is a separate event type that IS allowed to fire
  # from a GITHUB_TOKEN-driven workflow completion, so it bridges
  # the gap. We gate the job on conclusion=='success' below so a
  # failed refresh doesn't trigger a stale deploy.
  workflow_run:
    workflows:
      - "Refresh + deploy"
      - "Resolve match-only archetypes"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Don't fight refresh.yml's deploy — share the same concurrency group so
# Pages publishes serially. Cancel earlier deploys when a newer push lands
# (the latest commit wins).
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # When triggered by workflow_run, skip deploy if the upstream
    # refresh/resolve workflow failed — we don't want to publish a
    # partial or broken site. The other event types (push,
    # workflow_dispatch) have no upstream so this is a vacuous pass.
    if: >-
      ${{ github.event_name != 'workflow_run'
          || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When workflow_run triggers us, the default checkout is the
          # tip of the workflow definition file — NOT the commit that
          # refresh.yml just pushed. Explicitly checkout main to pick
          # up the fresh site files.
          ref: main

      - name: Stage Pages content
        run: |
          mkdir -p _site
          cp deadlock_builds.html _site/index.html
          cp deadlock_builds.html _site/deadlock_builds.html
          cp methodology.html     _site/methodology.html
          cp rank_distribution.html _site/rank_distribution.html
          cp favicon.svg          _site/favicon.svg
          cp -r assets _site/assets
          mkdir -p _site/docs
          cp -r docs/*.md _site/docs/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
