name: Resolve match-only archetypes

# Manual-trigger-only workflow that backfills the match-only archetype
# resolutions (methodology review §3.6). The bulk pass can take a long
# time on first run — Eternus+ uses a 1500-deep candidate sweep and
# each unresolved archetype runs ~17 minutes against the deadlock-api.
#
# The expensive resolution lives in this dedicated workflow (not the
# every-3-hours refresh) so:
#   - The site refresh stays fast (~3-5 min) and reliable.
#   - You can run this overnight or whenever without blocking deploys.
#   - The cache it produces persists across runs — once an archetype is
#     resolved, subsequent runs skip it instantly.
#
# Typical usage:
#   - Trigger once after first deploying methodology v2.
#   - Trigger again after each major patch drop (new heroes / new
#     ability ladders surface in the data, so new fingerprints appear).
#
# Setup required: same as refresh.yml (Pages permissions etc.).

on:
  workflow_dispatch:
    inputs:
      patch_id:
        description: 'Patch ID to resolve (empty = every patch in scripts/_paths.py)'
        required: false
        default: ''

permissions:
  contents: write       # commit the resolution cache back to main; deploy.yml handles Pages

concurrency:
  group: resolve-archetypes
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # GitHub Actions max is 360. Leave 10min buffer
                            # for cache save + commit steps.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pulp

      # Share the same cache layout as refresh.yml. This ensures the
      # resolver can read the per-hero JSONs that refresh.yml just
      # produced, AND that resolved files land in cache/ which the
      # refresh workflow's build_page_data.py will pick up next run.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          # Keep the key prefix in lockstep with refresh.yml — both
          # workflows share one cache layout.
          key: deadlock-cache-v2-${{ github.run_id }}
          restore-keys: |
            deadlock-cache-v2-

      # We need the heroes/<patch>/*_build.json files (with their
      # joint_archetypes and ability_orders fields) for the resolver
      # to enumerate which fingerprints to resolve. The refresh
      # workflow commits them to main, so a fresh checkout has them.
      # Loops over scripts/_paths.py PATCH_REGISTRY (same convention as
      # refresh.yml) so adding a patch there is the only edit needed.
      - name: Resolve all patches in the registry
        env:
          PYTHONUNBUFFERED: '1'
          PATCH_FILTER: ${{ github.event.inputs.patch_id }}
        run: |
          PATCHES="${PATCH_FILTER:-$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from _paths import PATCH_REGISTRY; print(' '.join(PATCH_REGISTRY))")}"
          echo "Resolving patches: $PATCHES"
          for p in $PATCHES; do
            echo "::group::$p"
            ls "heroes/$p/" | head -3 || { echo "no hero JSONs for $p yet — skipping"; echo "::endgroup::"; continue; }
            python3 -u scripts/match_archetype_resolver.py --bulk --patch "$p"
            echo "::endgroup::"
          done

      # Rebuild the page payload + HTML so the resolved items land on
      # the live site without waiting for the next refresh cron.
      - name: Recompile page payload
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u scripts/build_page_data.py
          python3 -u scripts/build_page.py

      - name: Commit resolution cache + page rebuild
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit the page (which now has resolved items embedded) and
          # the resolution cache files so future cache-restore runs
          # immediately have the resolutions available.
          git add -A deadlock_builds.html cache/match_archetype_resolutions/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit (everything was already cached)"
            exit 0
          fi
          git commit -m "chore: resolve match-only archetypes $(date -u +%Y-%m-%d)"
          # Retry-on-rebase loop in case main was updated by refresh.yml
          # or deploy.yml while this multi-hour job was running.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/main"
            git fetch origin main
            git rebase --autostash origin/main || {
              echo "Rebase failed — aborting"
              git rebase --abort
              exit 1
            }
            sleep 5
          done
          echo "Push still failing after 5 retries — giving up"
          exit 1

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: deadlock-cache-v2-${{ github.run_id }}

      # Pages deployment handled by .github/workflows/deploy.yml — it
      # auto-triggers off the commit step above pushing the rebuilt page
      # to main. Avoids racing the github-pages environment lock with
      # deploy.yml on the same run.
