name: Resolve match-only archetypes

# Backfills the match-only archetype resolutions (methodology review
# §3.6) for the CURRENT patch, on a schedule — no manual trigger needed.
#
# The expensive resolution lives here rather than in the every-3-hours
# refresh because a cold pass is slow: Eternus+ uses a 1500-deep
# candidate sweep and each unresolved archetype takes ~17 minutes.
# Keeping it separate means the site refresh stays ~3-5 min and reliable.
#
# Why a daily schedule works despite that cost:
#   - Resolutions are cached per (patch, hero, slice, fingerprint) AND
#     committed to the repo, so a resolved archetype is never recomputed.
#     Steady-state runs finish in minutes with nothing to do.
#   - Real work only appears when a new patch lands (new fingerprints) —
#     which detect_patches.py now picks up on its own, so this workflow
#     starts chewing on the new patch without anyone noticing it dropped.
#   - A cold patch that can't finish inside one job is fine: the resolve
#     step has its own timeout and its partial results are still
#     committed, so the next day's run resumes from where it stopped.
#     That's why the commit step is `if: always()`.
#
# Manual dispatch still works for forcing an older patch via patch_id.

on:
  schedule:
    # Every 3 hours at :40 — offset from the refresh cron (every 3h on the
    # hour) so the two don't race for the same push.
    #
    # Frequent ON PURPOSE, and it does not cost 8 full runs a day. Each run
    # starts with a ~0.3s file-existence check; when the patch is fully
    # populated the run ends there (~1 min of setup) and nothing else fires.
    # When there IS work — i.e. right after a new patch lands — this keeps
    # re-firing until the backlog is drained instead of chipping at it once
    # a day. The concurrency group below means a pass that outlives its
    # window isn't interrupted: the next tick simply queues behind it.
    - cron: '40 */3 * * *'
  workflow_dispatch:
    inputs:
      patch_id:
        description: 'Patch ID to resolve (default: the current patch from patches.json)'
        required: false
        default: ''

permissions:
  contents: write       # commit the resolution cache back to main; deploy.yml handles Pages

concurrency:
  group: resolve-archetypes
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # GitHub Actions max is 360. Leave 10min buffer
                            # for cache save + commit steps.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pulp

      # Share the same cache layout as refresh.yml. This ensures the
      # resolver can read the per-hero JSONs that refresh.yml just
      # produced, AND that resolved files land in cache/ which the
      # refresh workflow's build_page_data.py will pick up next run.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          # Keep the key prefix in lockstep with refresh.yml — both
          # workflows share one cache layout.
          key: deadlock-cache-v2-${{ github.run_id }}
          restore-keys: |
            deadlock-cache-v2-

      # Same guard as refresh.yml: the committed wiki-icon manifest is
      # the source of truth; don't let a stale cached copy stomp it
      # before the page recompile below reads it.
      - name: Prefer committed wiki-icon manifest over cached copy
        run: git checkout -- cache/wiki_icon_overrides.json 2>/dev/null || true

      # We need the heroes/<patch>/*_build.json files (with their
      # joint_archetypes and ability_orders fields) for the resolver
      # to enumerate which fingerprints to resolve. The refresh
      # workflow commits them to main, so a fresh checkout has them.
      # Defaults to the current patch only — that's the one the site
      # ships, and a full sweep of every historical patch would blow past
      # the job timeout. Pass patch_id to resolve an older one on purpose.
      #
      # timeout-minutes + continue-on-error are load-bearing, not sloppy:
      # a cold patch can legitimately need more than one job's worth of
      # time. A STEP timeout (unlike the job timeout) lets the remaining
      # steps run, so whatever was resolved still gets committed and the
      # next scheduled run picks up from there. The outcome is surfaced
      # as a warning in "Report resolution status" below.
      # Cheap precheck (file-existence only, no API calls, ~0.3s). Runs
      # every 3 hours, so once the patch is fully populated this is the
      # whole job: it reports 0 outstanding and everything below skips,
      # which is how the schedule "backs off to idle" without needing to
      # rewrite its own cron.
      - name: Check for outstanding archetypes
        id: check
        env:
          PATCH_FILTER: ${{ github.event.inputs.patch_id }}
        run: |
          PATCHES="${PATCH_FILTER:-$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from _paths import ACTIVE_PATCH_ID; print(ACTIVE_PATCH_ID)")}"
          echo "patches=$PATCHES" >> "$GITHUB_OUTPUT"
          total=0
          for p in $PATCHES; do
            [ -d "heroes/$p" ] || { echo "no hero JSONs for $p yet — skipping"; continue; }
            n=$(python3 scripts/match_archetype_resolver.py --bulk --patch "$p" --dry-run \
                  | grep '^OUTSTANDING=' | tail -1 | cut -d= -f2)
            echo "  $p: ${n:-0} outstanding"
            total=$((total + ${n:-0}))
          done
          echo "Total outstanding: $total"
          echo "outstanding=$total" >> "$GITHUB_OUTPUT"

      - name: Resolve archetypes
        id: resolve
        if: steps.check.outputs.outstanding != '0'
        continue-on-error: true
        timeout-minutes: 280
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          for p in ${{ steps.check.outputs.patches }}; do
            echo "::group::$p"
            [ -d "heroes/$p" ] || { echo "no hero JSONs for $p yet — skipping"; echo "::endgroup::"; continue; }
            python3 -u scripts/match_archetype_resolver.py --bulk --patch "$p"
            echo "::endgroup::"
          done

      # NOTE: this job deliberately does NOT rebuild deadlock_builds.html.
      # It used to, and that made the workflow structurally unable to ship
      # its own results: a resolve pass takes hours, the every-3-hours
      # refresh pushes its own rebuild of that same 9 MB generated file in
      # the meantime, and the commit below then hit an unresolvable rebase
      # conflict on it — losing the entire pass. (Seen for real on
      # 2026-07-30: 4.7 hours of resolution discarded at the rebase.)
      # Committing only the resolution JSONs means every push is
      # append-only new files that nothing else writes, so it can't
      # conflict. build_page_data.py picks the resolutions up on the next
      # refresh, which is at most 3 hours later.

      - name: Commit resolutions
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ONLY the resolution JSONs. These are append-only files keyed by
          # (patch, hero, slice, fingerprint) that no other workflow writes,
          # so a rebase onto a main that moved underneath us can never
          # conflict. Committing the generated page here is what broke this
          # job before — see the note above.
          git add -A cache/match_archetype_resolutions/ || true
          if git diff --cached --quiet; then
            echo "Nothing new resolved this run."
            exit 0
          fi
          n=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "chore: resolve $n match-only archetypes $(date -u +%Y-%m-%d)"
          # main almost certainly moved during a multi-hour pass (the
          # refresh workflow pushes every 3 hours), so expect to rebase.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt ($n files)"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/main"
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed — this should be impossible for append-only"
              echo "resolution files; investigate before trusting the next run."
              git rebase --abort
              exit 1
            }
            sleep 5
          done
          echo "Push still failing after 5 retries — giving up"
          exit 1

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: deadlock-cache-v2-${{ github.run_id }}

      # Make the resolve step's outcome explicit. Running out of time on a
      # cold patch is expected and self-healing (tomorrow's run resumes),
      # so it's a warning, not a red run. Any OTHER failure is a real bug
      # and fails the workflow — the frozen-pipeline lesson: never let a
      # broken step pass as green.
      - name: Report resolution status
        if: always()
        env:
          BEFORE: ${{ steps.check.outputs.outstanding }}
          OUTCOME: ${{ steps.resolve.outcome }}
        run: |
          if [ "$BEFORE" = "0" ]; then
            echo "Fully populated — nothing to resolve. Idling until a new patch lands."
            exit 0
          fi
          # Recount from disk so the summary reflects reality, not intent.
          LEFT=0
          for p in ${{ steps.check.outputs.patches }}; do
            n=$(python3 scripts/match_archetype_resolver.py --bulk --patch "$p" --dry-run \
                  | grep '^OUTSTANDING=' | tail -1 | cut -d= -f2)
            LEFT=$((LEFT + ${n:-0}))
          done
          echo "Outstanding: $BEFORE -> $LEFT"
          case "$OUTCOME" in
            success)
              if [ "$LEFT" = "0" ]; then
                echo "Patch fully populated."
              else
                echo "::warning::Pass finished but $LEFT archetype(s) remain "\
          "(individual failures). The next run retries them."
              fi ;;
            failure)
              # Expected on a cold patch: the step hit its 280-min wall.
              # Progress was committed, so the next tick (3h) continues.
              echo "::warning::Pass ran out of time with $LEFT remaining. "\
          "Progress was committed; the next scheduled run resumes." ;;
            *)
              echo "::error::Resolve step outcome was '$OUTCOME' — investigate."
              exit 1 ;;
          esac

      # Pages deployment handled by .github/workflows/deploy.yml — it
      # auto-triggers off the commit step above pushing the rebuilt page
      # to main. Avoids racing the github-pages environment lock with
      # deploy.yml on the same run.
